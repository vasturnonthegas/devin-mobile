name: DevinMobile
options:
  bundleIdPrefix: ai.devin.mobile
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

packages:
  DevinKit:
    path: DevinKit

targets:
  DevinMobile:
    type: application
    platform: iOS
    sources:
      - path: DevinMobile
    dependencies:
      - package: DevinKit
    info:
      path: DevinMobile/Info.plist
      properties:
        CFBundleDisplayName: Devin
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: ai.devin.mobile
            CFBundleURLSchemes: [devinmobile]
            CFBundleTypeRole: Viewer
        NSCameraUsageDescription: Take a photo to attach to a message for Devin.
        NSPhotoLibraryUsageDescription: Pick screenshots and photos to attach to a message for Devin.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    # The App Group doubles as the Keychain access group (`AppGroup.identifier` in DevinKit); every
    # extension target must list the same group. CI builds with CODE_SIGNING_ALLOWED=NO, so no team is needed.
    entitlements:
      path: DevinMobile/DevinMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.devin.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  DevinMobile:
    build:
      targets:
        DevinMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
