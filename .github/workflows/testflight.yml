name: TestFlight

# Tag `vX.Y.Z` (optionally `vX.Y.Z-anything`) → archive, export for App Store Connect, upload to
# TestFlight. Versioning is derived, never edited by hand:
#   MARKETING_VERSION (CFBundleShortVersionString) = tag without `v` and without a `-suffix`
#   CURRENT_PROJECT_VERSION (CFBundleVersion)      = this workflow's run number (monotonic, unique)
# Both are passed to xcodebuild, overriding the placeholders in project.yml for every target.
#
# Signing (repository secrets — the owner provides these; the job fails fast listing any missing):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8   App Store Connect API key (Admin or App Manager role,
#                                               "Access to Cloud Managed Distribution Certificate").
#                                               The .p8 may be raw PEM or base64.
#   APPLE_TEAM_ID                               10-character Developer Team ID.
# Optional, when cloud-managed signing is not wanted:
#   DISTRIBUTION_CERTIFICATE_P12_BASE64 + DISTRIBUTION_CERTIFICATE_PASSWORD
#                                               Apple Distribution certificate imported into a
#                                               throwaway keychain; profiles still come from the API key.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version X.Y.Z (default: latest v* tag reachable from this ref)'
        required: false
        type: string
      upload:
        description: 'Upload to TestFlight (off = archive + export only)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive + upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCHEME: DevinMobile
      ARCHIVE_PATH: build/DevinMobile.xcarchive
      EXPORT_PATH: build/export
      KEYCHAIN_NAME: devin-mobile-ci.keychain-db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} — see the header of .github/workflows/testflight.yml"
            exit 1
          fi

      - name: Resolve version and build number
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            raw="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            raw="$INPUT_VERSION"
          else
            raw="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
            if [ -z "$raw" ]; then
              raw="$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9.]+)"?.*$/\1/p' project.yml | head -n1)"
            fi
          fi
          version="${raw#v}"
          version="${version%%-*}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::'$raw' does not yield an X.Y[.Z] marketing version"
            exit 1
          fi
          {
            echo "MARKETING_VERSION=$version"
            echo "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"
          echo "Version $version ($GITHUB_RUN_NUMBER)"

      - name: Toolchain info
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # altool looks for AuthKey_<ID>.p8 in ~/private_keys; xcodebuild takes an explicit path.
          mkdir -p "$HOME/private_keys"
          key_path="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if [[ "$ASC_API_KEY_P8" == *"-----BEGIN"* ]]; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$key_path"
          else
            printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$key_path"
          fi
          chmod 600 "$key_path"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$key_path" || {
            echo "::error::ASC_API_KEY_P8 is not a PEM private key (raw or base64)"; exit 1; }
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Import distribution certificate (optional)
        if: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 != '' }}
        env:
          P12_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="$(uuidgen)"
          p12="$RUNNER_TEMP/distribution.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_NAME"
          security import "$p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_NAME"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain-db
          rm -f "$p12"
          echo "IMPORTED_KEYCHAIN=1" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DevinMobile.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            | tee archive.log | grep -E 'error:|warning:|ARCHIVE (SUCCEEDED|FAILED)' || true
          grep -q 'ARCHIVE SUCCEEDED' archive.log

      - name: Verify archived versions
        run: |
          set -euo pipefail
          shopt -s nullglob
          app="$ARCHIVE_PATH/Products/Applications/DevinMobile.app"
          # PlugIns/ holds the widget + share extensions, Extensions/ the ExtensionKit App Intents extension.
          for plist in "$app/Info.plist" "$app"/PlugIns/*.appex/Info.plist "$app"/Extensions/*.appex/Info.plist; do
            short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
            build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
            echo "$plist → $short ($build)"
            [ "$short" = "$MARKETING_VERSION" ] && [ "$build" = "$CURRENT_PROJECT_VERSION" ] || {
              echo "::error::$plist has $short ($build), expected $MARKETING_VERSION ($CURRENT_PROJECT_VERSION)"; exit 1; }
          done

      - name: Export for App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log | grep -E 'error:|EXPORT (SUCCEEDED|FAILED)' || true
          grep -q 'EXPORT SUCCEEDED' export.log
          ls -la "$EXPORT_PATH"

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(ls "$EXPORT_PATH"/*.ipa | head -n1)"
          xcrun altool --upload-app --type ios -f "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          {
            echo "### TestFlight"
            echo
            echo "Uploaded \`$(basename "$ipa")\` as **$MARKETING_VERSION ($CURRENT_PROJECT_VERSION)**."
            echo "Processing takes a few minutes; it then appears under App Store Connect → TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA + dSYMs
        if: ${{ always() && hashFiles('build/export/*.ipa') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: DevinMobile-${{ env.MARKETING_VERSION }}-${{ env.CURRENT_PROJECT_VERSION }}
          path: |
            build/export/*.ipa
            build/DevinMobile.xcarchive/dSYMs
          if-no-files-found: error

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          if [ -n "${IMPORTED_KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN_NAME" || true
          fi
