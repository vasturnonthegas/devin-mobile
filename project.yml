name: DevinMobile
options:
  bundleIdPrefix: ai.devin.mobile
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Single source of truth for CFBundleShortVersionString / CFBundleVersion of every target (App Store
    # Connect rejects an extension whose version differs from the app's). `.github/workflows/testflight.yml`
    # overrides both on the xcodebuild command line (tag `vX.Y.Z` → X.Y.Z, run number → build);
    # never hard-code them per target.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  DevinKit:
    path: DevinKit

targets:
  DevinMobile:
    type: application
    platform: iOS
    sources:
      - path: DevinMobile
    dependencies:
      - package: DevinKit
      - target: DevinWidget
      - target: DevinIntents
      - target: DevinShareExtension
    info:
      path: DevinMobile/Info.plist
      properties:
        CFBundleDisplayName: Devin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Launch screen = system background + the app icon tile (`Scripts/make-app-icon.swift` renders both
        # from one mark), so it blends into RootView and matches the home screen in light and dark.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchGlyph
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad must list all four orientations unless UIRequiresFullScreen; App Store Connect rejects otherwise.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: ai.devin.mobile
            CFBundleURLSchemes: [devinmobile]
            CFBundleTypeRole: Viewer
        NSCameraUsageDescription: Take a photo to attach to a message for Devin.
        NSPhotoLibraryUsageDescription: Pick screenshots and photos to attach to a message for Devin.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # `BackgroundRefresh.taskIdentifier` — the BGAppRefreshTask that polls for status changes.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [ai.devin.mobile.refresh]
        # `SessionLiveActivity` — the pinned session's Live Activity (rendered by DevinWidget).
        NSSupportsLiveActivities: true
    # The App Group doubles as the Keychain access group (`AppGroup.identifier` in DevinKit); every
    # extension target must list the same group. CI builds with CODE_SIGNING_ALLOWED=NO, so no team is needed.
    entitlements:
      path: DevinMobile/DevinMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.devin.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Home-screen widget. Reads the shared Keychain + `SessionSnapshot` through the same App Group;
  # never calls the API. Its Info.plist / entitlements are generated here, like the app's.
  DevinWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DevinWidget
    dependencies:
      - package: DevinKit
    info:
      path: DevinWidget/Info.plist
      properties:
        CFBundleDisplayName: Devin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DevinWidget/DevinWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.devin.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.mobile.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # Siri / Shortcuts. An App Intents extension (ExtensionKit) so intents and App Shortcuts run
  # without launching the app; it reads credentials from the shared Keychain and calls the API
  # through DevinKit. Embedded under `Extensions/`, unlike the widget's `PlugIns/`.
  DevinIntents:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: DevinIntents
    dependencies:
      - package: DevinKit
      - sdk: AppIntents.framework
    info:
      path: DevinIntents/Info.plist
      properties:
        CFBundleDisplayName: Devin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.appintents-extension
    entitlements:
      path: DevinIntents/DevinIntents.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.devin.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.mobile.intents
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # Share sheet → New Session. Parses the shared URL / text / images into a `SharedDraft`, parks it in
  # the App Group and brings the app forward; the app uploads the images and shows the prefilled form.
  DevinShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DevinShareExtension
    dependencies:
      - package: DevinKit
    info:
      path: DevinShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Devin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: DevinShareExtension.ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 5
    entitlements:
      path: DevinShareExtension/DevinShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.devin.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.mobile.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        # No App Intents in this target; without this the metadata extractor logs a `warning:` CI would flag.
        LM_SKIP_METADATA_EXTRACTION: YES

  # Accessibility audit (`performAccessibilityAudit`) against `-MockAPI`. Needs a booted simulator,
  # so CI only compiles the app; run it locally before touching inbox/detail layout.
  DevinMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DevinMobileUITests
    dependencies:
      - target: DevinMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DevinMobile:
    build:
      targets:
        DevinMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DevinMobileUITests
